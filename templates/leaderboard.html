{% extends "layout.html" %}

{% block title %}: Leaderboard{% endblock %}

{% block content %}
<h1>Leaderboard</h1>
<div class="board" data-api="api/updaterank">
{% include "board.html" %}
    {% if not session['user_id'] %}
        <p class="friends-hint"><a href="login?next=leaderboard">Log in</a> to get your games on the leaderboard.</p>
    {% endif %}
</div>

<script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
<script src="static/js/board.js"></script>
{% endblock %}
