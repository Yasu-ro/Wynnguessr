    {# the card Discord, WhatsApp, Twitter… show under a shared link; the image needs a full address #}
    {% set site = 'https://' ~ (request.host if request.host.endswith('wynndle.com') else 'wynndle.com') %}
    <meta name="description" content="Guess where you are in Wynncraft from a 360° photo. Solo or with friends.">
    {# a room link: the room, who waits in it (room_card) #}
    <meta property="og:title" content="{{ card.title if card else 'WynnGuessr – the Wynncraft GeoGuessr' }}">
    <meta property="og:description" content="{{ card.text if card else 'Guess where you are in Wynncraft from a 360° photo. Solo or with friends.' }}">
    <meta property="og:image" content="{{ site }}/{{ asset('banner.jpg') }}">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#a7eb64">
