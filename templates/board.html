    <form class="board-filters" id="filter-options">
        <div class="tabs">
            <input type="radio" name="mode" id="board-survival" value="survival" checked>
            <label for="board-survival" class="tab">Survival</label>
            <input type="radio" name="mode" id="board-classic" value="classic">
            <label for="board-classic" class="tab">Classic</label>
            <input type="radio" name="mode" id="board-levels" value="levels">
            <label for="board-levels" class="tab">Levels</label>
            <input type="radio" name="mode" id="board-wins" value="wins">
            <label for="board-wins" class="tab">Wins</label>
        </div>
        <div class="filters">
            <div class="board-group chips" id="board-difficulty">
                <span class="board-label">Difficulty</span>
                <input type="radio" name="difficulty" id="board-normal" value="normal" checked>
                <label for="board-normal" class="chip small">Normal</label>
                <input type="radio" name="difficulty" id="board-hard" value="hard">
                <label for="board-hard" class="chip small">Hard</label>
                <input type="radio" name="difficulty" id="board-hardcore" value="hardcore">
                <label for="board-hardcore" class="chip small">Hardcore</label>
            </div>
            <div class="board-group chips" id="board-milk">
                <span class="board-label">Milk</span>
                <input type="radio" name="milk" id="board-nomilk" value="0" checked>
                <label for="board-nomilk" class="chip small">Off</label>
                <input type="radio" name="milk" id="board-milkon" value="1">
                <label for="board-milkon" class="chip small">On</label>
            </div>
            <div class="board-group chips" id="board-rounds" hidden>
                <span class="board-label">Rounds</span>
                <input type="radio" name="rounds" id="board-3" value="3">
                <label for="board-3" class="chip small">3</label>
                <input type="radio" name="rounds" id="board-5" value="5" checked>
                <label for="board-5" class="chip small">5</label>
                <input type="radio" name="rounds" id="board-10" value="10">
                <label for="board-10" class="chip small">10</label>
                <input type="radio" name="rounds" id="board-25" value="25">
                <label for="board-25" class="chip small">25</label>
            </div>
            <div class="board-group chips" hidden>
                <span class="board-label">View</span>
                <input type="radio" name="nolook" id="board-free" value="No" checked>
                <label for="board-free" class="chip small">Free</label>
                <input type="radio" name="nolook" id="board-locked" value="Yes">
                <label for="board-locked" class="chip small">Locked</label>
            </div>
        </div>
    </form>

    <table class="leaderboard-table board-table">
        <thead>
            <tr class="leaderboard-row" id="board-head"></tr>
        </thead>
        <tbody id="board-mine" class="board-mine"></tbody>
        <tbody id="table-body"></tbody>
    </table>
    <p id="board-empty" class="hint" hidden>No games yet.</p>
    <button type="button" id="board-next" class="btn wood board-next" hidden>Show more</button>
