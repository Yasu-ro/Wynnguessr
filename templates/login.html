{% extends "layout.html" %}

{% block title %}: Login{% endblock %}

{% block content %}
    {% set next = '?next=' ~ (request.args['next'] | urlencode) if request.args.get('next') else '' %}
    <h1 class="sign">Login</h1>
    <div class="panel narrow">
        {% if wynn_login %}
        <a class="btn wide wynn-button" href="auth/wynncraft{{ next }}">Log in with Wynncraft</a>
        <p class="or">or</p>
        {% endif %}
        <form class="stack" action="login{{ next }}" method="post">
            <input class="field" placeholder="Username" aria-label="Username" name="username" autocomplete="off">
            <input class="field" placeholder="Password" aria-label="Password" type="password" name="password" autocomplete="off">
            <button type="submit" class="btn wide">Login</button>
        </form>
        <p class="hint">No account yet? <a href="register{{ next }}">Register</a></p>
    </div>
{% endblock %}
