<!DOCTYPE html>

<head>
    <!-- earth colour at once: no white flash before the stylesheets and the texture arrive -->
    <style>html, body { background-color: #6b5236; }</style>
    <title>Wynnguesser: Game</title>
    <link rel="stylesheet" href="{{ asset('style.css') }}">
    <link rel="icon" href="static/wynnlogo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Ubuntu:ital,wght@0,400;0,700;1,700&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="crossorigin=""/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta id="game-variables" provinces="{{provinces}}" timeLimit="{{time_limit}}" look="{{look}}" rounds="{{rounds}}" mode="{{mode}}">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a class="nav-icon" href="./">
                <img src="static/wynnlogo.png" alt="logo" height=31.1>
            </a>
            <a href="./">
                <div class="nav-link-left">
                    <i class="material-icons">home</i>Home
                </div>
            </a>
            <p id="round-number">
                Round: 1/{{rounds}}
            </p>
            <p id="totalScore">
                Score: 0
            </p>
            {% if time_limit > 0 %}
                <p id="time-left">
                    Time: {{time_limit}}
                </p>
            {% endif %}
        </div>
    </nav>
    <div id="countdown-screen">
        
    </div>
    <div class="guess-screen" id="guess-screen">

    </div>

    <div class="score-screen" id="score-screen">

    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://storage.googleapis.com/vrview/2.0/build/vrview.min.js"></script>
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
    <script src="{{ asset('js/game.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
</body>
