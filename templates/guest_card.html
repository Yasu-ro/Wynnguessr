        <form class="play-card" action="guest?next={{ next | urlencode }}" method="post">
            <i class="material-icons">badge</i>
            <h2>Choose a Nickname</h2>
            <input class="login-input guest-name" name="username" placeholder="Nickname" maxlength="20" autocomplete="off" required>
            <button type="submit" class="form-submit play-go">Play</button>
            <p>No account needed. To get your games on the leaderboard, <a href="login?next={{ next | urlencode }}">log in</a> or <a href="register?next={{ next | urlencode }}">register</a> instead.</p>
        </form>
