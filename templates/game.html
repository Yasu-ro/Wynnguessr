<!DOCTYPE html>
<html lang="en">
<head>
{% include "head.html" %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <link rel="stylesheet" href="{{ asset('style.css') }}">
    <title>WynnGuessr: Game</title>
{% include "share.html" %}
    <meta id="game-variables" provinces="{{provinces}}" timeLimit="{{time_limit}}" look="{{look}}" rounds="{{rounds}}" mode="{{mode}}" account="{{ 1 if session['loggedin'] else 0 }}">
</head>

<body class="game-page">
    <nav class="navbar">
        <a class="nav-logo" href="./" title="Home"><img src="static/wynnlogo.png" alt="WynnGuessr" width="40" height="40"></a>
        <a class="nav-btn" href="./"><i class="material-icons">home</i><span>Home</span></a>
        <p class="nav-stat" id="round-number">Round: 1/{{rounds}}</p>
        <p class="nav-stat" id="totalScore">Score: 0</p>
        {% if time_limit > 0 %}
        <p class="nav-stat" id="time-left">Time: {{time_limit}}</p>
        {% endif %}
    </nav>
    <div class="guess-screen" id="guess-screen"></div>
    <div class="score-screen" id="score-screen"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
    <script src="{{ asset('js/xp.js') }}"></script>
    <script src="{{ asset('js/game.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
</body>
</html>
