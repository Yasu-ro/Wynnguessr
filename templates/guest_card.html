        <form class="panel" action="guest?next={{ next | urlencode }}" method="post">
            <h2>Choose a Nickname</h2>
            <input class="field" name="username" placeholder="Nickname" aria-label="Nickname" maxlength="20" autocomplete="off" required>
            <button type="submit" class="btn wide">Play</button>
            <p class="hint">No account needed. <a href="login?next={{ next | urlencode }}">Log in</a> to save your scores.</p>
        </form>
