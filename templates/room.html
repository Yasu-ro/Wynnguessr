<!DOCTYPE html>

<head>
    <title>Wynnguesser: Room</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="icon" href="static/wynnlogo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="crossorigin=""/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta id="room-variables" code="{{code}}" rounds="{{rounds}}" timeLimit="{{time_limit}}" look="{{look}}">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a class="nav-icon" href="./">
                <img src="static/wynnlogo.png" alt="logo" height=31.1>
            </a>
            <a href="./">
                <div class="nav-link-left">
                    <i class="material-icons">home</i>Home
                </div>
            </a>
            <p id="round-number">Round: 0/{{rounds}}</p>
            <p id="totalScore">Score: 0</p>
            {% if time_limit > 0 %}
                <p id="time-left">Time: {{time_limit}}</p>
            {% endif %}
        </div>
    </nav>
    <div class="room-screen" id="room-screen" style="display: none"></div>
    <div class="guess-screen" id="guess-screen"></div>
    <div class="score-screen" id="score-screen"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
    <script src="static/js/room.js"></script>
</body>
