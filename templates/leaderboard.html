{% extends "layout.html" %}

{% block title %}: Leaderboard{% endblock %}

{% block content %}
<h1 class="sign">Leaderboard</h1>
<div class="board" data-api="api/updaterank">
{% include "board.html" %}
    {% if not session['loggedin'] %}
        <p class="hint"><a href="login?next=leaderboard">Log in</a> to get on the board.</p>
    {% endif %}
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js" integrity="sha256-wS9gmOZBqsqWxgIVgA8Y9WcQOa7PgSIX+rPA0VL2rbQ=" crossorigin=""></script>
<script src="{{ asset('js/board.js') }}"></script>
{% endblock %}
