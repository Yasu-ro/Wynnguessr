<!DOCTYPE html>
<html lang="en">
<head>
{% include "head.html" %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" integrity="sha256-p/HXuG8QaPIo2S8bCu+VvUHR4uEnhVFlc62/VS7ieT0=" crossorigin="">
    <link rel="stylesheet" href="{{ asset('style.css') }}">
    <title>WynnGuessr: Review</title>
</head>

<body class="review-page">
    <nav class="navbar">
        <a class="nav-logo" href="./" title="Home"><img src="{{ asset('wynnlogo.png') }}" alt="WynnGuessr" width="40" height="40"></a>
        <a class="nav-btn" href="./"><i class="material-icons">home</i><span>Home</span></a>
        <p class="nav-stat review-count"><span class="review-dot" data-review="planned"></span>Planned: <b id="count-planned">0</b></p>
        <p class="nav-stat review-count"><span class="review-dot" data-review="new"></span>New: <b id="count-new">0</b></p>
        <p class="nav-stat review-count"><span class="review-dot" data-review="kept"></span>Kept: <b id="count-kept">0</b></p>
        {% if can_push %}<button id="review-push" class="nav-btn">Push to wynndle.com</button>{% endif %}
    </nav>
    <div class="review-body">
        <div id="review-map"></div>
        <div id="review-panel" hidden>
            <div id="review-panorama" class="review-photo"></div>
            <p id="review-coords"></p>
            <div class="review-row review-photo">
                {% for p in provinces %}
                    <button class="review-choice" data-province="{{ p }}">{{ p.replace('-', ' ').title() }}</button>
                {% endfor %}
            </div>
            <div class="review-row">
                <button class="btn review-keep review-photo">Keep</button>
                <button class="btn red review-delete">Delete</button>
            </div>
            <div class="review-row">
                <button id="review-full" class="btn wood review-photo">Full screen</button>
            </div>
        </div>
    </div>
    <div id="focus" hidden>
        <div id="focus-panorama"></div>
        <div id="focus-map"></div>
        <div class="focus-bar">
            <span id="focus-coords"></span>
            {% for p in provinces %}
                <button class="review-choice" data-province="{{ p }}">{{ p.replace('-', ' ').title() }}</button>
            {% endfor %}
            <span class="focus-gap"></span>
            <label id="focus-spin-label">Spin <input id="focus-spin" type="range" min="0" max="60" value="0"></label>
            <button class="btn review-keep">Keep</button>
            <button class="btn red review-delete">Delete</button>
            <button id="focus-prev" class="btn wood">Previous</button>
            <button id="focus-next" class="btn wood">Next</button>
            <button id="focus-close" class="btn wood">Close</button>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js" integrity="sha256-oosvezOf0KYCxnad8dymrUOvc7yMalvmcglxUonBKpo=" crossorigin=""></script>
    <script src="{{ asset('js/review.js') }}"></script>
</body>
</html>
