<!DOCTYPE html>
<html lang="en">
<head>
{% include "head.html" %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <link rel="stylesheet" href="{{ asset('style.css') }}">
    <title>WynnGuessr: Survival</title>
{% include "share.html" %}
</head>

<body class="game-page survival-page" data-difficulty="{{ difficulty }}">
    <nav class="navbar">
        <a class="nav-logo" href="./" title="Home"><img src="static/wynnlogo.png" alt="WynnGuessr" width="40" height="40"></a>
        <a class="nav-btn" href="./"><i class="material-icons">home</i><span>Home</span></a>
        <button type="button" class="nav-btn" id="sound-button" title="Sound on/off"><i class="material-icons">volume_up</i></button>
        <p class="nav-stat" id="sv-round"></p>
        <p class="nav-stat" id="sv-points"></p>
        <p class="nav-stat" id="sv-time" hidden></p>
        <p class="nav-stat sv-effect" id="sv-effect" hidden></p>
    </nav>

    <div class="guess-screen" id="guess-screen" hidden>
        <div id="game-panorama"></div>
        <div class="sv-dark" id="sv-dark" hidden></div>
        <div class="hearts" id="hearts"></div>
        <div class="map-container">
            <div id="map"></div>
            <button id="guess-button" class="guess-button" type="button">Guess!</button>
        </div>
    </div>

    <div class="score-screen" id="score-screen" hidden>
        <div class="score-map" id="scoreMap"></div>
        <div id="score-container">
            <div class="hearts small" id="hearts-result"></div>
            <p id="sv-verdict"></p>
            <p id="sv-detail" class="score-info"></p>
            <div class="potion-throw" id="potion-throw" hidden><img id="potion-gif" alt="" width="128" height="128"></div>
            <div class="potion-card" id="potion-card" hidden></div>
            <div id="xp-slot" class="xp-slot"></div>
            <div class="sv-actions">
                <button id="next-button" class="next-button" type="button">Next Location</button>
                <button id="again-button" class="btn" type="button" hidden>Play Again</button>
                <a id="menu-button" class="btn wood" href="mode?play=solo" hidden>Back to Menu</a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
    <script src="{{ asset('js/sound.js') }}"></script>
    <script src="{{ asset('js/motion.js') }}"></script>
    <script src="{{ asset('js/xp.js') }}"></script>
    <script src="{{ asset('js/block.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script src="{{ asset('js/survival.js') }}"></script>
</body>
</html>
